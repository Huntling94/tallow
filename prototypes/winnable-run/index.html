<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tallow: a winnable run (prototype)</title>
<style>
  :root { --ground:#10181c; --panel:#19232a; --ink:#e4e6e1; --muted:#9aa5a3; --lamp:#f0a23c; --danger:#e0715f; --good:#7fc28f; --line:#2a3741; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; margin:0; background:var(--ground); color:var(--ink); font:15px/1.4 system-ui, sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; }
  #hud { display:flex; align-items:center; gap:20px; padding:8px 14px; background:var(--panel); }
  #season { color:var(--lamp); font-weight:600; }
  #townBox { display:flex; align-items:center; gap:8px; flex:1; max-width:320px; min-width:130px; transition:transform .1s; }
  #townBox.hit { transform:translateX(4px); }
  .bar { flex:1; height:12px; background:#0e1417; border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--good); transition:width .2s; }
  #moneyBox { font-weight:600; color:var(--lamp); min-width:70px; transition:transform .1s; }
  #moneyBox.bump { transform:scale(1.2); }
  #moneyBox.short { color:var(--danger); }
  #mapBox { flex:1; min-height:0; position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #gl { pointer-events:none; }
  #bar { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:8px 14px; background:var(--panel); }
  #next { flex:1; min-width:120px; color:#ffb4a6; font-size:13.5px; text-align:right; }
  #tools { flex:1; min-width:0; display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:6px; }
  #side { display:flex; flex-direction:column; gap:6px; }
  .card { display:grid; grid-template-columns:52px 1fr; column-gap:8px; align-items:center; text-align:left; padding:4px 8px 4px 4px; min-width:0; }
  .card img { grid-row:span 2; width:52px; height:42px; object-fit:contain; background:#10181c; border-radius:4px; }
  .card b { font-weight:600; font-size:14px; white-space:nowrap; }
  .card b i { font-style:normal; color:var(--lamp); margin-left:5px; }
  .card small { color:var(--muted); font-size:11.5px; line-height:1.2; }
  .card kbd { display:none; }
  #menu { position:absolute; z-index:3; width:230px; display:flex; flex-direction:column; gap:5px; padding:6px; background:#141d23f2; border:1px solid var(--lamp); border-radius:7px; box-shadow:0 6px 20px #0009; }
  #menu .title { color:var(--muted); font-size:12.5px; padding:0 3px; }
  @media (max-width:640px) { #tools { grid-template-columns:repeat(2, minmax(0, 1fr)); } #next { display:none; } }
  button { font:inherit; color:var(--ink); background:#22303a; border:1px solid var(--line); border-radius:5px; padding:7px 11px; cursor:pointer; }
  button:hover { background:#2b3b46; }
  button.on { background:#3a2c17; border-color:var(--lamp); }
  button.poor { opacity:.5; }
  button.primary { color:#1a1208; background:var(--lamp); border-color:var(--lamp); font-weight:600; min-width:140px; }
  button.quiet { color:var(--muted); padding:4px 9px; font-size:13px; }
  button .cost { color:var(--lamp); margin-left:6px; }
  #end { z-index:4; position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:#0b1114cc; text-align:center; padding:16px; }
  #end h2 { margin:0; font-size:30px; color:var(--lamp); }
  #end p { margin:0; color:var(--ink); }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span id="season"></span>
    <div id="townBox"><span>Town</span><div class="bar"><i id="townBar"></i></div><span id="townText"></span></div>
    <div id="moneyBox"></div>
    <span id="next"></span>
    <button id="sound" class="quiet"></button>
  </div>
  <div id="mapBox">
    <canvas id="gl"></canvas>
    <canvas id="map"></canvas>
    <div id="menu" hidden></div>
    <div id="end" hidden><h2 id="endTitle"></h2><p id="endBody"></p><button class="primary" id="again">New run</button></div>
  </div>
  <div id="bar">
    <div id="tools"></div>
    <div id="side"><button id="go" class="primary"></button><button id="speed">1×</button></div>
  </div>
</div>

<script>
// RULES-START
// Throwaway prototype rules. Nothing here is shared with game/.
const TUNE = {
  startMoney: 220,
  seasonPay: 60,
  killReward: 8,
  town: 20,
  herds: [8, 11, 14, 17, 20],
  beastHealth: [2, 3, 4, 5, 7],
  entrances: [1, 1, 2, 2, 3], // how many ways in each season
  mix: [{}, { runner: 0.25 }, { runner: 0.2, ironhide: 0.15 }, { runner: 0.25, ironhide: 0.2 }, { runner: 0.25, ironhide: 0.25 }],
  spawnEvery: 1.3,
  firstSpawn: 1.4,
  speed: 55,
  lengthShy: 1 / 90, // how much longer roads put beasts off
  fenceReach: 26,
  fenceSlow: 0.45,
  shallowsSlow: 0.55,
  shotSpeed: 190,
  potSeconds: 0.9,
  hillRange: 1.15,
  sellBack: 0.5,
};

const KINDS = {
  common: { name: 'Beasts', health: 1, speed: 1, shy: 1, harm: 1, reward: 1, pitProof: false, size: 1.3 },
  runner: { name: 'Runners', health: 0.5, speed: 1.6, shy: 0.2, harm: 1, reward: 1, pitProof: false, fenceProof: true, size: 0.95 },
  ironhide: { name: 'Ironhides', health: 2, speed: 0.75, shy: 1, harm: 2, reward: 2, pitProof: true, size: 1.6 },
  bull: { name: 'The Old Bull', health: 5, speed: 0.6, shy: 0.5, harm: 5, reward: 6, pitProof: true, size: 2.4 },
};

const DEFENCES = {
  tower: { name: 'Tower', cost: 60, spot: 'pad', range: 72, reload: 0.7, damage: 1, scare: 0.2 },
  mortar: { name: 'Mortar', cost: 110, spot: 'pad', range: 100, reload: 2.4, damage: 3, splash: 34, scare: 0.3 },
  pit: { name: 'Pit', cost: 30, spot: 'road', holds: 2, scare: 0 },
  fence: { name: 'Fence', cost: 20, spot: 'road', scare: 1.6 },
};

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

// The valley is a network of roads. Beasts pick a road at every fork.
const NODES = {
  west: { x: 12, y: 200 }, north: { x: 236, y: 4 }, south: { x: 236, y: 396 },
  a: { x: 110, y: 200 }, b: { x: 236, y: 100 }, c: { x: 236, y: 300 }, d: { x: 345, y: 200 },
  e: { x: 452, y: 112 }, f: { x: 452, y: 288 }, m: { x: 530, y: 200 }, gate: { x: 596, y: 200 },
};
const ENTRANCES = { west: 'West', north: 'North', south: 'South' };
const NEAREST_TOWN_FIRST = ['gate', 'm', 'e', 'f', 'd', 'b', 'c', 'a', 'west', 'north', 'south'];
const GATE = NODES.gate;

function curve(p) {
  const out = [];
  for (let i = 0; i < p.length - 1; i++) {
    const a = p[Math.max(i - 1, 0)], b = p[i], c = p[i + 1], e = p[Math.min(i + 2, p.length - 1)];
    for (let s = 0; s < 10; s++) {
      const t = s / 10, t2 = t * t, t3 = t2 * t;
      const mix = (k) => 0.5 * (2 * b[k] + (c[k] - a[k]) * t + (2 * a[k] - 5 * b[k] + 4 * c[k] - e[k]) * t2 + (3 * b[k] - a[k] - 3 * c[k] + e[k]) * t3);
      out.push({ x: mix('x'), y: mix('y') });
    }
  }
  out.push({ ...p[p.length - 1] });
  return out;
}

function makeRoad(from, to, bends, extra) {
  const pts = curve([NODES[from], ...bends.map(([x, y]) => ({ x, y })), NODES[to]]);
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + dist(pts[i - 1], pts[i]));
  return { from, to, pts, cum, len: cum[cum.length - 1], ...extra };
}

const ROADS = [
  makeRoad('west', 'a', [], { fixed: true }),
  makeRoad('north', 'b', [[232, 50]], { fixed: true }),
  makeRoad('south', 'c', [[232, 350]], { fixed: true }),
  makeRoad('a', 'b', [[166, 138]], {}),
  makeRoad('a', 'd', [[172, 226], [262, 178]], {}),
  makeRoad('a', 'c', [[166, 262]], {}),
  makeRoad('b', 'e', [[345, 62]], { cutting: true }),
  makeRoad('b', 'd', [[296, 146]], {}),
  makeRoad('c', 'd', [[296, 254]], {}),
  makeRoad('c', 'f', [[345, 340]], { shallows: true }),
  makeRoad('d', 'e', [[402, 166]], {}),
  makeRoad('d', 'm', [[436, 214]], {}),
  makeRoad('d', 'f', [[402, 240]], {}),
  makeRoad('e', 'm', [[500, 150]], {}),
  makeRoad('f', 'm', [[500, 250]], {}),
  makeRoad('m', 'gate', [], { fixed: true }),
];
const OUT = {};
ROADS.forEach((road, i) => { (OUT[road.from] = OUT[road.from] || []).push(i); });

function pointOn(road, d) {
  const { pts, cum } = road;
  if (d <= 0) return pts[0];
  if (d >= road.len) return pts[pts.length - 1];
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= d) lo = mid; else hi = mid; }
  const t = (d - cum[lo]) / (cum[hi] - cum[lo]);
  return { x: pts[lo].x + (pts[hi].x - pts[lo].x) * t, y: pts[lo].y + (pts[hi].y - pts[lo].y) * t };
}

function headingOn(road, d) {
  const a = pointOn(road, d - 2), b = pointOn(road, d + 2);
  return Math.atan2(b.y - a.y, b.x - a.x);
}

function rangeOf(spot, type) { return DEFENCES[type].range * (spot.hill ? TUNE.hillRange : 1); }

// Places to build. Pads sit beside roads and take towers and mortars; hills add range.
// Marks sit on a road and take pits or fences. The way in and the last stretch take neither.
const SPOTS = [];
const PADS = [
  [150, 170], [150, 232], [214, 150], [214, 250], [292, 104], [292, 296], [345, 150], [345, 256],
  [446, 182], [440, 150], [440, 250], [345, 374], [150, 104], [150, 296],
  [278, 202, true], [404, 125, true], [404, 280, true],
];
for (const [x, y, hill] of PADS) {
  const spot = { id: `p${SPOTS.length}`, kind: 'pad', x, y, hill: !!hill, h: hill ? 15 : 0, reach: { tower: [], mortar: [] } };
  for (const type of ['tower', 'mortar']) {
    ROADS.forEach((road, r) => {
      if (road.pts.some((p) => dist(spot, p) <= rangeOf(spot, type))) spot.reach[type].push(r);
    });
  }
  SPOTS.push(spot);
}
ROADS.forEach((road, r) => {
  if (road.fixed) return;
  for (const share of road.len > 150 ? [0.33, 0.67] : [0.5]) {
    const d = road.len * share, p = pointOn(road, d);
    SPOTS.push({ id: `r${r}${share * 100}`, kind: 'road', x: p.x, y: p.y, h: 0, road: r, d, angle: headingOn(road, d), reach: { pit: [r], fence: [r] } });
  }
});
const SPOT = Object.fromEntries(SPOTS.map((s) => [s.id, s]));

function pick(weights, rng) {
  let draw = rng();
  for (let i = 0; i < weights.length; i++) {
    draw -= weights[i];
    if (draw < 0) return i;
  }
  return weights.length - 1;
}

function makeRng(seed) { // mulberry32
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// The herd is decided ahead of time, so the warning before each season is true.
function planSeason(run) {
  const s = run.season - 1, ways = [];
  for (let i = 0; i < TUNE.entrances[s]; i++) ways.push(run.order[(s + i) % 3]);
  const size = TUNE.herds[s], mix = TUNE.mix[s], queue = [], kinds = {};
  const last = {};
  for (let i = 0; i < size; i++) {
    const way = ways[i % ways.length];
    let kind = 'common', draw = run.rng();
    for (const k of Object.keys(mix)) { draw -= mix[k]; if (draw < 0) { kind = k; break; } }
    kinds[kind] = true;
    last[way] = (last[way] === undefined ? TUNE.firstSpawn - TUNE.spawnEvery : last[way]) + TUNE.spawnEvery;
    queue.push({ at: last[way], way, kind });
  }
  if (run.season === TUNE.herds.length) {
    queue.push({ at: TUNE.firstSpawn + (size / ways.length / 2) * TUNE.spawnEvery, way: ways[0], kind: 'bull' });
    kinds.bull = true;
  }
  queue.sort((a, b) => a.at - b.at);
  return { ways, queue, kinds: Object.keys(kinds).filter((k) => k !== 'common') };
}

function newRun(seed) {
  const run = {
    seed, rng: makeRng(seed), season: 1, money: TUNE.startMoney, town: TUNE.town,
    built: {}, fresh: [], tracks: ROADS.map(() => 0), kills: 0, night: null, over: null, order: ['west', 'north', 'south'],
  };
  for (let i = 2; i > 0; i--) {
    const j = Math.floor(run.rng() * (i + 1));
    [run.order[i], run.order[j]] = [run.order[j], run.order[i]];
  }
  run.plan = planSeason(run);
  return run;
}

function scares(run, fenceProof) {
  const out = ROADS.map(() => 0);
  for (const id of Object.keys(run.built)) {
    const type = run.built[id].type;
    if (type === 'fence' && fenceProof) continue;
    for (const r of SPOT[id].reach[type]) out[r] += DEFENCES[type].scare;
  }
  return out;
}

// The odds are never shown: the player reads them from where the beasts walk.
// At a fork a beast weighs each road by the whole way from there to the town.
function oddsAt(run, node, kind) {
  const { shy, fenceProof } = KINDS[kind];
  const scare = scares(run, fenceProof), cost = { gate: 0 };
  const stepCost = (r) => ROADS[r].len * TUNE.lengthShy + scare[r] * shy + (ROADS[r].shallows ? 0.5 : 0) + cost[ROADS[r].to];
  for (const n of NEAREST_TOWN_FIRST) if (n !== 'gate') cost[n] = Math.min(...OUT[n].map(stepCost));
  const us = OUT[node].map((r) => -stepCost(r));
  const top = Math.max(...us);
  const ws = us.map((u) => Math.exp(u - top));
  const total = ws.reduce((a, b) => a + b, 0);
  return ws.map((w) => w / total);
}

function canPlace(run, type, id) {
  const spot = SPOT[id], d = DEFENCES[type];
  if (!spot || spot.kind !== d.spot || run.built[id]) return 'spot';
  if (run.money < d.cost) return 'money';
  return '';
}

function place(run, type, id) {
  const reason = canPlace(run, type, id);
  if (reason) return reason;
  run.money -= DEFENCES[type].cost;
  run.built[id] = { type, wait: 0, left: DEFENCES[type].holds || 0, aim: -Math.PI / 2, fired: -9 };
  if (!run.night) run.fresh.push(id);
  return '';
}

function sellPrice(run, id) {
  const cost = DEFENCES[run.built[id].type].cost;
  return run.fresh.includes(id) ? cost : Math.floor(cost * TUNE.sellBack);
}

function sell(run, id) {
  run.money += sellPrice(run, id);
  delete run.built[id];
  run.fresh = run.fresh.filter((s) => s !== id);
}

function herdSize(run) { return run.plan.queue.length; }
function finalSeason(run) { return run.season === TUNE.herds.length; }

function startNight(run) {
  run.fresh = [];
  run.night = { time: 0, queue: run.plan.queue.slice(), beasts: [], shots: [], pots: [], events: [], killed: 0, breached: 0, walked: ROADS.map(() => 0), done: false, nextId: 1 };
}

function placeOf(b, ahead) {
  const road = ROADS[b.road], d = Math.min(b.d + (ahead || 0), road.len);
  const p = pointOn(road, d), a = headingOn(road, d);
  const fade = Math.min(1, d / 24, (road.len - d) / 24);
  return { x: p.x - Math.sin(a) * b.off * fade, y: p.y + Math.cos(a) * b.off * fade, a };
}

function slay(run, b, how) {
  const n = run.night, at = placeOf(b), kind = KINDS[b.kind];
  b.dead = true;
  const reward = TUNE.killReward * kind.reward;
  run.money += reward;
  run.kills += 1;
  n.killed += 1;
  n.events.push({ kind: how, x: at.x, y: at.y, a: at.a, reward, beast: b.kind });
}

function paceOf(run, b) {
  const road = ROADS[b.road];
  let pace = TUNE.speed * KINDS[b.kind].speed;
  if (road.shallows && b.d > road.len * 0.3 && b.d < road.len * 0.7) pace *= TUNE.shallowsSlow;
  for (const id of Object.keys(run.built)) {
    const s = SPOT[id];
    if (run.built[id].type === 'fence' && !KINDS[b.kind].fenceProof && s.road === b.road && Math.abs(s.d - b.d) < TUNE.fenceReach) pace *= TUNE.fenceSlow;
  }
  return pace;
}

function moveBeast(run, b, dt) {
  const n = run.night, kind = KINDS[b.kind];
  const was = b.d, step = paceOf(run, b) * dt;
  b.d += step;
  b.walked += step;
  for (const id of Object.keys(run.built)) {
    const s = SPOT[id], def = run.built[id];
    if (def.type !== 'pit' || s.road !== b.road || def.left <= 0 || kind.pitProof) continue;
    if (was < s.d && b.d >= s.d) {
      def.left -= 1;
      slay(run, b, 'pit');
      return;
    }
  }
  while (b.d >= ROADS[b.road].len) {
    const road = ROADS[b.road];
    if (road.to === 'gate') {
      b.dead = true;
      run.town = Math.max(run.town - kind.harm, 0);
      n.breached += 1;
      n.events.push({ kind: 'breach', harm: kind.harm, beast: b.kind });
      if (run.town <= 0) { run.over = 'lost'; n.done = true; }
      return;
    }
    b.d -= road.len;
    b.road = OUT[road.to][pick(oddsAt(run, road.to, b.kind), run.rng)];
    n.walked[b.road] += 1;
  }
}

function fireTowers(run, dt) {
  const n = run.night;
  for (const id of Object.keys(run.built)) {
    const def = run.built[id], spot = SPOT[id], d = DEFENCES[def.type];
    if (!d.reload) continue;
    def.wait -= dt;
    if (def.wait > 0) continue;
    const range = rangeOf(spot, def.type);
    let target = null, best = -1, at = null;
    for (const b of n.beasts) {
      if (b.dead || b.walked <= best || b.health <= b.incoming) continue;
      const p = placeOf(b);
      if (dist(spot, p) <= range) { target = b; best = b.walked; at = p; }
    }
    if (!target) continue;
    def.wait = d.reload;
    def.aim = Math.atan2(at.y - spot.y, at.x - spot.x);
    def.fired = n.time;
    const x = spot.x + Math.cos(def.aim) * 13, y = spot.y + Math.sin(def.aim) * 13;
    if (def.type === 'mortar') {
      const lead = placeOf(target, paceOf(run, target) * TUNE.potSeconds);
      n.pots.push({ x0: spot.x, y0: spot.y, h0: 18 + spot.h, x: lead.x, y: lead.y, t: 0 });
      n.events.push({ kind: 'lob', x, y, h: 18 + spot.h });
    } else {
      target.incoming += d.damage;
      n.shots.push({ x, y, h0: 30 + spot.h, target, damage: d.damage, a: def.aim, gone: false });
      n.events.push({ kind: 'fire', x, y, h: 30 + spot.h, a: def.aim });
    }
  }
}

function moveShots(run, dt) {
  const n = run.night;
  for (const s of n.shots) {
    if (s.target.dead) { s.gone = true; continue; }
    const p = placeOf(s.target);
    const far = Math.hypot(p.x - s.x, p.y - s.y);
    const step = TUNE.shotSpeed * dt;
    s.a = Math.atan2(p.y - s.y, p.x - s.x);
    if (far > step) { s.x += Math.cos(s.a) * step; s.y += Math.sin(s.a) * step; continue; }
    s.gone = true;
    s.target.health -= s.damage;
    s.target.incoming -= s.damage;
    s.target.hitAt = n.time;
    n.events.push({ kind: 'hit', x: p.x, y: p.y });
    if (s.target.health <= 0) slay(run, s.target, 'kill');
  }
  n.shots = n.shots.filter((s) => !s.gone);
  for (const pot of n.pots) {
    pot.t += dt / TUNE.potSeconds;
    if (pot.t < 1) continue;
    n.events.push({ kind: 'blast', x: pot.x, y: pot.y });
    for (const b of n.beasts) {
      if (b.dead || dist(pot, placeOf(b)) > DEFENCES.mortar.splash) continue;
      b.health -= DEFENCES.mortar.damage;
      b.hitAt = n.time;
      if (b.health <= 0) slay(run, b, 'kill');
    }
  }
  n.pots = n.pots.filter((p) => p.t < 1);
}

function stepNight(run, dt) {
  const n = run.night;
  n.time += dt;
  while (n.queue.length && n.queue[0].at <= n.time) {
    const q = n.queue.shift(), kind = KINDS[q.kind];
    const health = Math.max(1, Math.round(TUNE.beastHealth[run.season - 1] * kind.health));
    const road = OUT[q.way][0];
    n.walked[road] += 1;
    n.beasts.push({ id: n.nextId++, road, kind: q.kind, d: 0, walked: 0, off: (run.rng() - 0.5) * 8, health, full: health, hitAt: -9, dead: false, incoming: 0 });
  }
  for (const b of n.beasts) {
    if (!b.dead) moveBeast(run, b, dt);
    if (run.over) return;
  }
  fireTowers(run, dt);
  moveShots(run, dt);
  n.beasts = n.beasts.filter((b) => !b.dead);
  if (!n.queue.length && !n.beasts.length && !n.pots.length) {
    n.done = true;
    if (run.season >= TUNE.herds.length) run.over = 'won';
  }
}

  MESH.window = shape((m) => { m.box(0, 0, 0, 19, 3.4, 3.6, '#ffc766'); m.box(0, 0, 0, 4, 3.4, 15.6, '#ffc766'); });
  MESH.beast = shape((m) => {

    m.cyl(16, 7, -2.6, 1, 0.1, 6, 4, '#e6dcc3'); m.cyl(16, 7, 2.6, 1, 0.1, 6, 4, '#e6dcc3');

  MESH.leg = shape((m) => m.box(0, -8, 0, 2.8, 8, 2.8, '#6a5040'));
  MESH.tower = shape((m) => {

    m.cyl(0, 24, 0, 9, 9, 2.4, 8, '#6f5a43');

  MESH.mortar = shape((m) => {

  MESH.barrel = shape((m) => { m.cyl(0, 0, 0, 5.6, 7, 13, 8, '#3f4a50'); m.cyl(0, 13, 0, 7.4, 7.4, 1.6, 8, '#6a7479'); });
  MESH.pot = shape((m) => m.ball(0, 0, 0, 3.4, 3.4, 3.4, '#ffb85c', 3, 6));
  MESH.beacon = shape((m) => { m.cyl(0, 0, 0, 7, 3, 58, 6, '#ffffff'); });
  MESH.plates = shape((m) => {

  });
  MESH.lamp = shape((m) => m.ball(0, 0, 0, 2.6, 2.6, 2.6, '#ffc766', 3, 6));
  MESH.bow = shape((m) => {

    m.box(10, -0.8, 0, 3, 2, 18, '#7a644a');
    m.box(-4, -5, 0, 4, 5, 4, '#4b3b2c');
  });
  MESH.pit = shape((m) => {
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * 6.2832;
      m.cyl(Math.cos(a) * 13, 0, Math.sin(a) * 9.5, 0.9, 0.1, 5.5, 4, '#a58d5f');
    }
  });
  MESH.peg = shape((m) => m.ball(0, 0, 0, 1.8, 1.8, 1.8, '#ffe0a0', 2, 5));
  MESH.fence = shape((m) => {
    for (const z of [-15, -5, 5, 15]) m.cyl(0, 0, z, 1.5, 1, 15, 5, '#8d6a42');
    m.box(0, 5, 0, 1.4, 1.6, 34, '#c2925a'); m.box(0, 10, 0, 1.4, 1.6, 34, '#c2925a');
  });
  MESH.disc = shape((m) => m.disc(0, '#ffffff'));
  MESH.ring = shape((m) => m.disc(0.84, '#ffffff'));
  MESH.pitHole = shape((m) => m.disc(0, '#000000'));
  MESH.shot = shape((m) => { m.box(0, -0.8, 0, 17, 1.6, 1.6, '#ffffff'); m.cyl(9, 0, 0, 2, 0, 3, 4, '#ffffff'); });
}

// --- Camera ---
let cam = { w: 0, h: 0 }, viewProj = null, eye = [0, 0, 0];
function placeCamera(w, h) {
  const dir = norm([0, 0.68, 0.73]), at = [334, 0, 176], aspect = w / h;
  const proj = perspective(32 * Math.PI / 180, aspect, 20, 3000);
  const corners = [[2, 0, 398], [668, 0, 398], [2, 0, 0], [680, 0, 0]];
  let d = 800;
  for (let i = 0; i < 6; i++) {
    const vp = mul(proj, lookAt([at[0] + dir[0] * d, dir[1] * d, at[2] + dir[2] * d], at));
    let most = 0;
    for (const [x, y, z] of corners) {
      const cw = vp[3] * x + vp[7] * y + vp[11] * z + vp[15];
      most = Math.max(most, Math.abs((vp[0] * x + vp[4] * y + vp[8] * z + vp[12]) / cw), Math.abs((vp[1] * x + vp[5] * y + vp[9] * z + vp[13]) / cw));
    }
    d *= most / 0.99;
  }
  cam = { w, h, proj, at, dir, d };
}
function setView(jx, jz) {
  const { at, dir, d, proj } = cam;
  eye = [at[0] + dir[0] * d + jx, dir[1] * d, at[2] + dir[2] * d + jz];
  viewProj = mul(proj, lookAt(eye, [at[0] + jx, 0, at[2] + jz]));
}
// Where a point in the world lands on screen, in CSS pixels.
function project(x, y, z) {
  const m = viewProj, w = m[3] * x + m[7] * y + m[11] * z + m[15];
  return { x: ((m[0] * x + m[4] * y + m[8] * z + m[12]) / w + 1) / 2 * cam.w, y: (1 - (m[1] * x + m[5] * y + m[9] * z + m[13]) / w) / 2 * cam.h };
}

function draw3(mesh, model, tint, glow) {
  gl.uniformMatrix4fv(U.uM, false, model);
  gl.uniform4fv(U.uTint, tint || [1, 1, 1, 1]);
  gl.uniform1f(U.uGlow, glow || 0);
  gl.bindVertexArray(mesh.vao);
  gl.drawArrays(gl.TRIANGLES, 0, mesh.count);
}
function flat(mesh, x, z, y, r, tint, rz) { // something lying on the ground
  gl.depthMask(false);
  draw3(mesh, chain(T(x, y, z), S(r, 1, rz || r)), tint, 1);
  gl.depthMask(true);
}

// Pictures for the build cards: each defence drawn once by the same 3D renderer.
function makeThumbs() {
  glCanvas.width = 156; glCanvas.height = 126;
  gl.viewport(0, 0, 156, 126);
  gl.useProgram(mainProgram);
  gl.uniform1i(U.uUseTex, 0);
  gl.uniform4fv(U.uLP, new Float32Array([40, 70, 60, 220])); gl.uniform3fv(U.uLC, new Float32Array([0.9, 0.75, 0.55]));
  gl.uniform1i(U.uLN, 1);
  gl.uniform3fv(U.uEye, [0, 0, 0]);
  for (const type of Object.keys(DEFENCES)) {
    const tall = DEFENCES[type].reload ? (type === 'tower' ? 19 : 8) : 3, far = type === 'tower' ? 96 : 60;
    gl.uniformMatrix4fv(U.uVP, false, mul(perspective(0.62, 156 / 126, 1, 800), lookAt([far * 0.55, tall + far * 0.5, far], [0, tall, 0])));
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    drawDefence({ x: 0, y: 0, h: 0, angle: 0.5 }, { type, left: DEFENCES[type].holds || 0, aim: -0.5, fired: -9 }, null, 1);
    THUMB[type] = glCanvas.toDataURL();
  }
}

// --- Game flow ---
function start() {
  run = newRun(Math.floor(Math.random() * 1e9));
  tool = ''; hover = null; paused = false;
  closeMenu();
  sparks = []; floats = []; stains = []; bodies = []; rings = []; flashes = []; shake = 0; redFlash = 0;
  shownMoney = run.money;
  say('A herd is coming', `From the ${forecast()}. Click a ring to build.`);
  $('end').hidden = true;
  paintTracks();
  refresh();
}

function forecast() {
  const plan = run.plan, names = plan.ways.map((w) => ENTRANCES[w]);
  const ways = names.length > 1 ? `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}` : names[0];
  const kinds = plan.kinds.map((k) => KINDS[k].name).join(', ');
  return kinds ? `${ways}, with ${kinds}` : ways;
}

function say(title, sub) { banner = { title, sub, age: 0, life: 2.6 }; }

// Sound is a few short synth notes. It starts after the first click, as browsers require.
function beep(freq, length, kind, volume, drop) {
  if (!soundOn || !audio) return;
  try {
    const now = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
    o.type = kind; o.frequency.setValueAtTime(freq, now);
    if (drop) o.frequency.exponentialRampToValueAtTime(drop, now + length);
    g.gain.setValueAtTime(volume, now); g.gain.exponentialRampToValueAtTime(0.0008, now + length);
    o.connect(g).connect(audio.destination); o.start(now); o.stop(now + length);
  } catch { soundOn = false; }
}
window.addEventListener('pointerdown', () => {
  if (audio) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch { soundOn = false; }
});

function spotAt(e) {
  const box = overlay.getBoundingClientRect(), mx = e.clientX - box.left, my = e.clientY - box.top;
  let best = null, bestD = Math.max(20, cam.h / 26);
  for (const s of SPOTS) {
    if (!run.built[s.id] && tool && DEFENCES[tool].spot !== s.kind) continue;
    const p = project(s.x, s.h, s.y), d = Math.hypot(p.x - mx, p.y - my);
    if (d < bestD) { bestD = d; best = s; }
  }
  return best;
}

function addSparks(x, y, z, n, colour, force, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, f = force * (0.3 + Math.random());
    sparks.push({ x, y, z, vx: Math.cos(a) * f, vy: force * (0.3 + Math.random()), vz: Math.sin(a) * f, age: 0, life: life * (0.6 + Math.random() * 0.6), colour, size: 2.5 + Math.random() * 3 });
  }
  if (sparks.length > 700) sparks.splice(0, sparks.length - 700);
}

function addFloat(x, z, h, text, colour, size) { floats.push({ x, z, h, text, colour, size: size || 15, age: 0, life: 1.1 }); }
function addFlash(x, y, z, colour, r, life) { flashes.push({ x, y, z, colour, r, age: 0, life }); }
function nudge(id, name) { const el = $(id); el.classList.add(name); setTimeout(() => el.classList.remove(name), 130); }

// Rules only record what happened; this turns each record into something to see and hear.
function play(e) {
  if (e.kind === 'fire') {
    addSparks(e.x, e.h, e.y, 4, PALE, 34, 0.18);
    addFlash(e.x, e.h + 2, e.y, AMBER, 40, 0.12);
    beep(520, 0.07, 'square', 0.015, 170);
  } else if (e.kind === 'lob') {
    addSparks(e.x, e.h, e.y, 10, AMBER, 44, 0.3);
    addFlash(e.x, e.h + 4, e.y, AMBER, 50, 0.16);
    beep(130, 0.16, 'square', 0.04, 70);
  } else if (e.kind === 'blast') {
    addSparks(e.x, 6, e.y, 34, AMBER, 95, 0.6);
    addSparks(e.x, 4, e.y, 14, DUST, 60, 0.7);
    addFlash(e.x, 18, e.y, AMBER, 90, 0.28);
    rings.push({ x: e.x, z: e.y, age: 0, life: 0.4, r: DEFENCES.mortar.splash, colour: AMBER });
    stains.push({ x: e.x, z: e.y, r: 13 });
    shake = Math.max(shake, 2.5);
    beep(80, 0.3, 'sawtooth', 0.07, 36);
  } else if (e.kind === 'hit') {
    addSparks(e.x, 11, e.y, 7, PALE, 50, 0.3);
    beep(180, 0.05, 'triangle', 0.03);
  } else if (e.kind === 'kill' || e.kind === 'pit') {
    const big = KINDS[e.beast].size, boss = e.beast === 'bull';
    if (e.kind === 'kill') {
      addSparks(e.x, 9 * big, e.y, Math.round(14 * big), AMBER, 60, 0.6);
      rings.push({ x: e.x, z: e.y, age: 0, life: 0.45, r: 20 * big, colour: AMBER });
      stains.push({ x: e.x, z: e.y, r: (6 + Math.random() * 4) * big });
      if (stains.length > 90) stains.shift();
    } else {
      addSparks(e.x, 3, e.y, 16, DUST, 42, 0.55);
      rings.push({ x: e.x, z: e.y, age: 0, life: 0.5, r: 26, colour: DUST });
      beep(240, 0.25, 'sawtooth', 0.03, 60);
    }
    bodies.push({ x: e.x, z: e.y, a: e.a, age: 0, life: e.kind === 'pit' ? 0.7 : 1.5, how: e.kind, big, beast: e.beast });
    addFloat(e.x, e.y, 16 * big, `+${e.reward}`, '#ffc766', boss ? 26 : 17);
    beep(660, 0.1, 'triangle', 0.035, 880);
  } else if (e.kind === 'breach') {
    const boss = e.beast === 'bull', big = boss ? 2.2 : 1;
    shake = Math.max(shake, 7 * big);
    redFlash = Math.min(0.5, 0.3 * big);
    justHurt = 0.3;
    addSparks(GATE.x, 14, GATE.y, Math.round(26 * big), RED, 80, 0.7);
    addFlash(GATE.x, 24, GATE.y, RED, 110, 0.35);
    rings.push({ x: GATE.x, z: GATE.y, age: 0, life: 0.5, r: 60, colour: RED });
    addFloat(GATE.x - 8, GATE.y, 34, `-${e.harm}`, '#ff8d7a', boss ? 34 : 26);
    beep(110, 0.35, 'sawtooth', 0.09, 42);
    nudge('townBox', 'hit');
  }
}

function afterNight() {
  const n = run.night;
  if (run.over) { finish(); return; }
  const clean = n.breached === 0;
  nextSeason(run);
  paintTracks();
  stains = [];
  addFloat(GATE.x - 8, GATE.y + 34, 26, `+${TUNE.seasonPay}`, '#ffc766', 24);
  beep(392, 0.16, 'triangle', 0.05); setTimeout(() => beep(523, 0.22, 'triangle', 0.05), 130);
  say(finalSeason(run) ? 'The last herd' : clean ? 'Dawn: not one got through' : 'Dawn', `Next: ${forecast()}. Bright tracks show where they walked.`);
  refresh();
}

function finish() {
  closeMenu();
  $('end').hidden = false;
  if (run.over === 'won') {
    $('endTitle').textContent = 'The town holds';
    $('endBody').textContent = `Five herds beaten with ${run.town} of ${TUNE.town} town and $${run.money} left.`;
    beep(523, 0.5, 'triangle', 0.06);
  } else {
    $('endTitle').textContent = 'The town falls';
    $('endBody').textContent = `Overrun in season ${run.season} of ${TUNE.herds.length}.`;
    beep(90, 0.9, 'sawtooth', 0.09, 30);
  }
  refresh();
}

function release() {
  closeMenu();
  if (run.night) { paused = !paused; refresh(); return; }
  startNight(run);
  paused = false;
  say(`Season ${run.season}`, `A herd of ${herdSize(run)} from the ${forecast()}`);
  beep(150, 0.7, 'sawtooth', 0.05, 110);
  refresh();
}

function refresh() {
  const night = run.night;
  $('season').textContent = `Season ${run.season} of ${TUNE.herds.length}`;
  $('townText').textContent = run.town;
  $('townBar').style.width = `${run.town / TUNE.town * 100}%`;
  $('townBar').style.background = run.town / TUNE.town > 0.3 ? 'var(--good)' : 'var(--danger)';
  $('moneyBox').textContent = `$${run.money}`;
  $('go').textContent = run.over ? 'Run over' : night ? (paused ? 'Resume' : 'Pause') : 'Release the herd';
  $('go').disabled = !!run.over;
  $('speed').textContent = `${speed}×`;
  $('sound').textContent = soundOn ? 'Sound on' : 'Sound off';
  $('next').textContent = run.over ? '' : `${night ? 'Coming from' : 'Next herd'}: ${forecast()}`;
  document.querySelectorAll('#tools button').forEach((b) => {
    b.classList.toggle('on', b.dataset.tool === tool);
    b.classList.toggle('poor', run.money < DEFENCES[b.dataset.tool].cost);
  });
}

function card(key) {
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.tool = key;
  b.innerHTML = `<img alt="" src="${THUMB[key]}"><b>${DEFENCES[key].name}<i>$${DEFENCES[key].cost}</i></b><small>${BLURBS[key]}</small>`;
  return b;
}

function buildTools() {
  Object.keys(DEFENCES).forEach((key, i) => {
    const b = card(key);
    b.title = `Key ${i + 1}`;
    b.onclick = () => choose(key);
    $('tools').appendChild(b);
  });
}

function choose(key) { tool = tool === key ? '' : key; hover = null; closeMenu(); refresh(); }

function closeMenu() { menuSpot = null; preview = ''; $('menu').hidden = true; }

function openMenu(s) {
  const m = $('menu'), def = run.built[s.id];
  menuSpot = s; preview = '';
  m.innerHTML = '';
  if (def) {
    const head = document.createElement('div');
    head.className = 'title'; head.textContent = DEFENCES[def.type].name;
    const sellButton = document.createElement('button');
    sellButton.textContent = `Sell for $${sellPrice(run, s.id)}`;
    sellButton.onclick = () => {
      addFloat(s.x, s.y, 20, `+$${sellPrice(run, s.id)}`, '#ffc766', 14);
      sell(run, s.id);
      beep(300, 0.08, 'triangle', 0.03);
      closeMenu(); refresh();
    };
    m.append(head, sellButton);
  } else {
    const head = document.createElement('div');
    head.className = 'title'; head.textContent = s.hill ? 'High ground: longer range' : s.kind === 'pad' ? 'Beside the road' : 'On the road';
    m.appendChild(head);
    for (const key of Object.keys(DEFENCES)) {
      if (DEFENCES[key].spot !== s.kind) continue;
      const b = card(key);
      if (run.money < DEFENCES[key].cost) b.classList.add('poor');
      b.onmouseenter = () => { preview = key; };
      b.onmouseleave = () => { preview = ''; };
      b.onclick = () => { build(s, key); };
      m.appendChild(b);
    }
  }
  m.hidden = false;
  const p = project(s.x, s.h, s.y), w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = `${Math.min(Math.max(p.x - w / 2, 8), cam.w - w - 8)}px`;
  m.style.top = `${p.y - h - 18 > 8 ? p.y - h - 18 : Math.min(p.y + 20, cam.h - h - 8)}px`;
}

function build(s, type) {
  const why = place(run, type, s.id);
  if (why === 'money') {
    addFloat(s.x, s.y, 20, 'Not enough money', '#ff8d7a', 14);
    nudge('moneyBox', 'short'); beep(140, 0.12, 'square', 0.025);
  } else if (!why) {
    rings.push({ x: s.x, z: s.y, age: 0, life: 0.35, r: 26, colour: AMBER });
    addSparks(s.x, 2 + s.h, s.y, 12, DUST, 42, 0.35);
    beep(200, 0.09, 'triangle', 0.06, 110);
    closeMenu();
  }
  refresh();
}

// --- Drawing the scene ---
function setLights() {
  const pos = [], col = [];
  const add = (x, y, z, r, c, power) => { if (pos.length < MAX_LIGHTS * 4) { pos.push(x, y, z, r); col.push(c[0] * power, c[1] * power, c[2] * power); } };
  add(GATE.x + 40, 46, GATE.y, 90, justHurt > 0 ? RED : AMBER, 0.2 + 0.4 * run.town / TUNE.town + (justHurt > 0 ? 0.8 : 0));
  for (const f of flashes.slice(-3)) add(f.x, f.y, f.z, f.r, f.colour, 2 * (1 - f.age / f.life));
  for (const id of Object.keys(run.built)) if (DEFENCES[run.built[id].type].reload) add(SPOT[id].x - 6, 44 + SPOT[id].h, SPOT[id].y, 56, AMBER, 0.7);
  gl.uniform4fv(U.uLP, new Float32Array(pos)); gl.uniform3fv(U.uLC, new Float32Array(col));
  gl.uniform1i(U.uLN, pos.length / 4);
}

function drawBeast(b, n, time) {
  const p = placeOf(b), big = KINDS[b.kind].size;
  const hit = n.time - b.hitAt < 0.1;
  const rate = KINDS[b.kind].speed;
  const bob = Math.abs(Math.sin(time * 5.5 * rate + b.id)) * 0.9;
  flat(MESH.disc, p.x, p.y, 0.5, 15 * big, [0, 0, 0, 0.35], 9 * big);
  const body = chain(T(p.x, bob, p.y), Ry(-p.a), S(big));
  const tint = hit ? [1, 1, 1, 1] : TINTS[b.kind];
  draw3(MESH.beast, body, tint, hit ? 0.9 : 0.35);
  if (KINDS[b.kind].pitProof) draw3(MESH.plates, body, [1, 1, 1, 1], 0.3);
  [[7, 4.6, 0], [7, -4.6, 3.1], [-7, 4.6, 3.1], [-7, -4.6, 0]].forEach(([lx, lz, phase]) => {
    draw3(MESH.leg, chain(body, T(lx, 8, lz), Rz(Math.sin(time * 11 * rate + b.id * 1.7 + phase) * 0.55)), tint, hit ? 0.9 : 0);
  });
}

function drawBody(k, dt) {
  k.age += dt;
  const t = Math.min(k.age / k.life, 1), base = T(k.x, 0, k.z);
  const c = TINTS[k.beast], tint = [c[0] * 0.8, c[1] * 0.8, c[2] * 0.8, 1];
  if (k.how === 'pit') {
    draw3(MESH.beast, chain(base, T(0, -t * 22, 0), Ry(-k.a), Rz(-t * 0.9), S(k.big * (1 - t * 0.4))), tint);
  } else {
    const fall = Math.min(t * 3.5, 1), sink = Math.max(t - 0.6, 0) * 2.5;
    draw3(MESH.beast, chain(base, T(0, -sink * 16, 0), Ry(-k.a), Rx(fall * 1.45), S(k.big)), tint);
  }
}

function drawDefence(s, def, night, alpha) {
  const tint = [1, 1, 1, alpha], y = s.h || 0;
  const since = night && night.time >= def.fired ? night.time - def.fired : 9;
  if (def.type === 'tower') {
    const back = since < 0.14 ? 3.5 * (1 - since / 0.14) : 0;
    draw3(MESH.tower, T(s.x, y, s.y), tint);
    draw3(MESH.bow, chain(T(s.x, y + 30, s.y), Ry(-def.aim), T(-back, 0, 0)), tint);
    draw3(MESH.lamp, T(s.x - 7.5, y + 39, s.y), since < 0.1 ? [1.5, 1.5, 1.5, alpha] : tint, 1);
  } else if (def.type === 'mortar') {
    const kick = since < 0.25 ? 3 * (1 - since / 0.25) : 0;
    draw3(MESH.mortar, T(s.x, y, s.y), tint);
    draw3(MESH.barrel, chain(T(s.x, y + 9 - kick, s.y), Ry(-def.aim), Rz(-0.55), S(1.15)), tint);
    draw3(MESH.lamp, T(s.x - 8, y + 16, s.y + 6), since < 0.2 ? [1.5, 1.5, 1.5, alpha] : tint, 1);
  } else if (def.type === 'pit') {
    flat(MESH.pitHole, s.x, s.y, 0.7, 13, [1, 1, 1, alpha], 9.5);
    draw3(MESH.pit, T(s.x, 0, s.y), def.left > 0 ? tint : [0.45, 0.45, 0.45, alpha]);
    for (let i = 0; i < DEFENCES.pit.holds; i++) {
      draw3(MESH.peg, T(s.x + (i - 0.5) * 9, 9, s.y - 13), i < def.left ? tint : [0.25, 0.22, 0.2, alpha], 1);
    }
  } else {
    draw3(MESH.fence, chain(T(s.x, 0, s.y), Ry(-s.angle)), tint);
  }
}

function rangeDisc(s, type, c) {
  const r = rangeOf(s, type);
  gl.disable(gl.DEPTH_TEST);
  flat(MESH.disc, s.x, s.y, 1, r, [...c, 0.13]);
  flat(MESH.ring, s.x, s.y, 1, r, [...c, 0.5]);
  gl.enable(gl.DEPTH_TEST);
}

function drawScene(dt, time) {
  const n = run.night;
  gl.clearColor(0.075, 0.105, 0.14, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(mainProgram);
  gl.uniformMatrix4fv(U.uVP, false, viewProj);
  gl.uniform3fv(U.uEye, eye);
  gl.uniform4f(U.uBox, GX[0], GZ[0], GX[1] - GX[0], GZ[1] - GZ[0]);
  gl.uniform1i(U.uTex, 0);
  setLights();

  gl.uniform1i(U.uUseTex, 1);
  gl.uniformMatrix4fv(U.uM, false, T(0, 0, 0));
  gl.uniform4f(U.uTint, 1, 1, 1, 1); gl.uniform1f(U.uGlow, 0);
  gl.bindVertexArray(ground.vao);
  gl.drawElements(gl.TRIANGLES, ground.count, gl.UNSIGNED_INT, 0);
  gl.uniform1i(U.uUseTex, 0);

  draw3(MESH.scenery, T(0, 0, 0));
  draw3(MESH.town, T(0, 0, 0), justHurt > 0 ? [1.6, 0.6, 0.55, 1] : [1, 1, 1, 1]);
  const lit = Math.ceil(run.town / TUNE.town * HOUSES.length);
  HOUSES.forEach(([x, z, turn], i) => {
    draw3(MESH.window, chain(T(x, 4.5, z), Ry(turn)), i < lit ? [1, 1, 1, 1] : [0.07, 0.08, 0.1, 1], 1);
  });

  for (const s of stains) flat(MESH.disc, s.x, s.z, 0.55, s.r, [0.42, 0.33, 0.16, 0.75], s.r * 0.7);

  const pulse = 0.55 + Math.sin(time * 4) * 0.3;
  for (const s of SPOTS) {
    if (run.built[s.id]) continue;
    if (tool && DEFENCES[tool].spot !== s.kind) continue;
    const hot = s === menuSpot ? 1 : tool ? pulse : s.kind === 'pad' ? 0.6 : 0.34;
    flat(MESH.ring, s.x, s.y, s.h + 0.9, s.hill ? 17 : s.kind === 'pad' ? 13 : 11, s.hill ? [1, 0.86, 0.45, hot] : [1, 0.66, 0.25, hot]);
  }
  if (!run.night || run.night.queue.length) {
    for (const way of run.plan.ways) {
      const at = NODES[way];
      draw3(MESH.beacon, T(at.x, 0, at.y), [1, 0.3, 0.25, 0.3 + 0.2 * Math.sin(time * 5)], 1);
    }
  }

  for (const id of Object.keys(run.built)) drawDefence(SPOT[id], run.built[id], n, 1);
  if (n) for (const b of n.beasts) if (!b.dead) drawBeast(b, n, time);
  for (const k of bodies) drawBody(k, dt);
  bodies = bodies.filter((k) => k.age < k.life);

  if (n) for (const s of n.shots) {
    const p = placeOf(s.target), far = Math.hypot(p.x - s.x, p.y - s.y);
    const h = 11 + (s.h0 - 11) * Math.min(far / 70, 1);
    draw3(MESH.shot, chain(T(s.x, h, s.y), Ry(-s.a), S(2.2, 2.6, 2.6)), [1, 0.95, 0.75, 1], 1);
    sparks.push({ x: s.x, y: h, z: s.y, vx: 0, vy: 0, vz: 0, age: 0, life: 0.28, colour: AMBER, size: 10 });
  }

  if (n) for (const p of n.pots) {
    const x = p.x0 + (p.x - p.x0) * p.t, z = p.y0 + (p.y - p.y0) * p.t, y = p.h0 * (1 - p.t) + 150 * p.t * (1 - p.t);
    draw3(MESH.pot, chain(T(x, y, z), S(1.3)), [1, 1, 1, 1], 1);
    sparks.push({ x, y, z, vx: 0, vy: 0, vz: 0, age: 0, life: 0.3, colour: AMBER, size: 8 });
    flat(MESH.ring, p.x, p.y, 1, DEFENCES.mortar.splash * (0.4 + 0.6 * p.t), [1, 0.35, 0.25, 0.5]);
  }

  // Preview: what you are about to build, and how far it reaches.
  const ghost = menuSpot ? (run.built[menuSpot.id] ? null : menuSpot) : hover && !run.built[hover.id] ? hover : null;
  const ghostType = menuSpot ? preview : tool;
  if (ghost && ghostType) {
    const ok = run.money >= DEFENCES[ghostType].cost;
    if (DEFENCES[ghostType].range) rangeDisc(ghost, ghostType, ok ? AMBER : RED);
    drawDefence(ghost, { type: ghostType, left: DEFENCES[ghostType].holds || 0, aim: -Math.PI / 2, fired: -9 }, null, ok ? 0.75 : 0.35);
  }
  const looked = menuSpot || hover;
  if (looked && run.built[looked.id] && DEFENCES[run.built[looked.id].type].range) rangeDisc(looked, run.built[looked.id].type, AMBER);

  for (const r of rings) {
    r.age += dt;
    const t = r.age / r.life;
    flat(MESH.ring, r.x, r.z, 1.2, 6 + r.r * t, [...r.colour, Math.max(1 - t, 0)]);
  }
  rings = rings.filter((r) => r.age < r.life);
  for (const f of flashes) f.age += dt;
  flashes = flashes.filter((f) => f.age < f.life);

  // Sparks are glowing points, drawn last and added on top of the scene.
  for (const p of sparks) {
    p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vy -= 170 * dt; p.vx *= 0.97; p.vz *= 0.97;
    if (p.y < 0.5) { p.y = 0.5; p.vy *= -0.3; }
  }
  sparks = sparks.filter((p) => p.age < p.life);
  if (sparks.length) {
    const data = new Float32Array(sparks.length * 9);
    sparks.forEach((p, i) => data.set([p.x, p.y, p.z, p.size, Math.max(1 - p.age / p.life, 0), 0, ...p.colour], i * 9));
    gl.useProgram(sparkProgram);
    gl.uniformMatrix4fv(SU.uVP, false, viewProj);
    gl.uniform1f(SU.uScale, glCanvas.height * 1.4);
    gl.bindVertexArray(MESH.sparkVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, MESH.sparkBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE); gl.depthMask(false);
    gl.drawArrays(gl.POINTS, 0, sparks.length);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(true);
  }
}

// Everything flat sits on a 2D layer above the 3D scene, placed by projecting world points.
function drawOverlay(dt) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), { w, h } = cam;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const n = run.night, unit = Math.min(Math.max(Math.min(h / 520, w / 800), 0.8), 1.5);

  ctx.textAlign = 'center';
  ctx.font = `700 ${13 * unit}px system-ui, sans-serif`; ctx.lineWidth = 3; ctx.strokeStyle = '#0a0f12'; ctx.fillStyle = '#ffb4a6';
  for (const way of run.plan.ways) {
    const at = project(NODES[way].x + (way === 'west' ? 26 : 0), 62, NODES[way].y);
    ctx.strokeText(ENTRANCES[way], at.x, at.y); ctx.fillText(ENTRANCES[way], at.x, at.y);
  }
  ctx.textAlign = 'left';

  if (n) for (const b of n.beasts) {
    if (b.dead || b.health >= b.full) continue;
    const p = placeOf(b), big = KINDS[b.kind].size, at = project(p.x, 22 * big, p.y);
    const bw = (b.kind === 'bull' ? 56 : 26) * unit, share = Math.max(b.health / b.full, 0);
    ctx.fillStyle = '#0a0f12'; ctx.fillRect(at.x - bw / 2 - 1, at.y - 1, bw + 2, 6);
    ctx.fillStyle = share > 0.5 ? '#7fc28f' : share > 0.25 ? '#e8c35a' : '#e0715f';
    ctx.fillRect(at.x - bw / 2, at.y, bw * share, 4);
  }

  ctx.textAlign = 'center';
  for (const f of floats) {
    f.age += dt;
    const t = f.age / f.life, at = project(f.x, f.h, f.z);
    ctx.globalAlpha = t < 0.7 ? 1 : Math.max((1 - t) / 0.3, 0);
    ctx.font = `700 ${f.size * unit}px system-ui, sans-serif`;
    const y = at.y - 34 * unit * Math.sqrt(Math.min(t, 1));
    ctx.lineWidth = 3; ctx.strokeStyle = '#0a0f12'; ctx.strokeText(f.text, at.x, y);
    ctx.fillStyle = f.colour; ctx.fillText(f.text, at.x, y);
  }
  ctx.globalAlpha = 1;
  floats = floats.filter((f) => f.age < f.life);

  if (redFlash > 0) {
    redFlash = Math.max(redFlash - dt * 1.1, 0);
    const edge = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.65);
    edge.addColorStop(0, 'rgba(224,60,50,0)'); edge.addColorStop(1, `rgba(224,60,50,${redFlash})`);
    ctx.fillStyle = edge; ctx.fillRect(0, 0, w, h);
  }

  if (banner) {
    banner.age += dt;
    const t = banner.age / banner.life;
    if (t >= 1) banner = null;
    else {
      const alpha = Math.min(banner.age / 0.25, (1 - t) / 0.25, 1);
      const y = h * 0.2 + (1 - Math.min(banner.age / 0.25, 1)) * 16;
      ctx.globalAlpha = alpha * 0.8; ctx.fillStyle = '#0a0f12'; ctx.fillRect(0, y - 46 * unit, w, 82 * unit);
      ctx.globalAlpha = alpha; ctx.fillStyle = '#f0a23c'; ctx.font = `700 ${32 * unit}px system-ui, sans-serif`; ctx.fillText(banner.title, w / 2, y);
      ctx.fillStyle = '#e4e6e1'; ctx.font = `${15 * unit}px system-ui, sans-serif`; ctx.fillText(banner.sub, w / 2, y + 24 * unit);
      ctx.globalAlpha = 1;
    }
  }
  ctx.textAlign = 'left';
}

function draw(dt, time) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const box = overlay.getBoundingClientRect();
  const pw = Math.round(box.width * dpr), ph = Math.round(box.height * dpr);
  if (overlay.width !== pw || overlay.height !== ph || cam.w !== box.width || cam.h !== box.height) {
    overlay.width = pw; overlay.height = ph; glCanvas.width = pw; glCanvas.height = ph;
    gl.viewport(0, 0, pw, ph);
    placeCamera(box.width, box.height);
  }
  shake = Math.max(shake - dt * 22, 0);
  setView(shake ? (Math.random() - 0.5) * shake : 0, shake ? (Math.random() - 0.5) * shake : 0);
  justHurt = Math.max(justHurt - dt, 0);
  drawScene(dt, time);
  drawOverlay(dt);
}

overlay.addEventListener('mousemove', (e) => {
  hover = run.over ? null : spotAt(e);
  overlay.style.cursor = hover ? 'pointer' : 'default';
});
overlay.addEventListener('mouseleave', () => { hover = null; });
overlay.addEventListener('click', (e) => {
  if (run.over) return;
  const s = spotAt(e);
  if (!s) { closeMenu(); return; }
  if (tool && !run.built[s.id]) { build(s, tool); return; }
  if (menuSpot === s) closeMenu(); else openMenu(s);
});
$('go').onclick = release;
$('speed').onclick = () => { speed = speed === 1 ? 2 : 1; refresh(); };
$('sound').onclick = () => { soundOn = !soundOn; refresh(); };
$('again').onclick = start;
window.addEventListener('keydown', (e) => {
  if (!run) return;
  if (e.code === 'Space') { e.preventDefault(); if (!run.over) release(); }
  const key = Object.keys(DEFENCES)[Number(e.key) - 1];
  if (key) choose(key);
  if (e.key === 'Escape') { tool = ''; hover = null; closeMenu(); refresh(); }
});

const TICK = 1 / 60;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const n = run.night;
  if (n && !n.done && !paused) {
    spare += dt * speed;
    while (spare >= TICK && !n.done) { stepNight(run, TICK); spare -= TICK; }
  }
  if (n) {
    for (const e of n.events.splice(0)) play(e);
    if (n.done && !n.handled) { n.handled = true; afterNight(); }
  }
  if (run.money !== shownMoney) {
    if (run.money > shownMoney) nudge('moneyBox', 'bump');
    shownMoney = run.money;
    refresh();
  }
  $('townText').textContent = run.town;
  $('townBar').style.width = `${run.town / TUNE.town * 100}%`;
  $('townBar').style.background = run.town / TUNE.town > 0.3 ? 'var(--good)' : 'var(--danger)';
  draw(dt, now / 1000);
  requestAnimationFrame(frame);
}

if (!gl) {
  $('end').hidden = false;
  $('endTitle').textContent = 'This browser cannot show 3D';
  $('endBody').textContent = 'The prototype needs WebGL2.';
  $('again').hidden = true;
  $('bar').hidden = true;
} else {
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  buildGround();
  buildMeshes();
  MESH.sparkVao = gl.createVertexArray();
  MESH.sparkBuffer = gl.createBuffer();
  gl.bindVertexArray(MESH.sparkVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, MESH.sparkBuffer);
  [0, 1, 2].forEach((i) => { gl.enableVertexAttribArray(i); gl.vertexAttribPointer(i, 3, gl.FLOAT, false, 36, i * 12); });
  makeThumbs();
  buildTools();
  start();
  requestAnimationFrame((t) => { last = t; frame(t); });
  // A hook for scripted checks in the browser.
  window.__game = { get run() { return run; }, setSpeed(x) { speed = x; } };
}
</script>
</body>
</html>
