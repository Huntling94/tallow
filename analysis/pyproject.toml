[project]
name = "tallow-analysis"
version = "0.1.0"
description = "Reads Tallow telemetry and fits models from it. Never re-implements game rules."
readme = "README.md"
license = "MIT"
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
