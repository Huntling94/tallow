name: Balance
description: Numbers that feel wrong, or a strategy that dominates.
title: "balance: "
labels: ["type: balance"]
body:
  - type: textarea
    id: observation
    attributes:
      label: What you observed
      description: What feels too strong, too weak, too easy or too hard.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Seeds, bot win rates, telemetry, or a playtest note.
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Balance target affected
      description: The target or design rule this touches, if known.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
