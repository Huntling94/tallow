version: 2
updates:
  # GitHub Actions used by the CI workflows. Python dependencies are added
  # when the analysis project lands.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "type: chore"
      - "system: ci"
    groups:
      actions:
        patterns: ["*"]
