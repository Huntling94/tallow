name: analysis

# Lints and tests the Python analysis package in analysis/.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: analysis

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff format --check
          uv run ruff check

      - name: Run tests
        run: uv run pytest
