name: godot

# Lints the GDScript, runs the Godot tests headless with gdUnit4, and runs a
# smoke test of the path from the headless runner to Python.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Lint GDScript
        run: |
          pip install --quiet gdtoolkit==4.5.0
          files=$(git ls-files 'game/*.gd')
          if [ -z "$files" ]; then echo "No GDScript files"; exit 1; fi
          gdformat --check $files
          gdlint $files

      - name: Install Godot
        run: |
          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -sSfL -o "$RUNNER_TEMP/$zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/$zip"
          echo "${GODOT_SHA512}  $RUNNER_TEMP/$zip" | sha512sum --check
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install gdUnit4
        run: python tools/godot/install_gdunit4.py

      - name: Run tests
        run: python tools/godot/run_tests.py

  # Spec 0027: the whole data path, from the headless runner to Python.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"

      - name: Install Godot
        run: |
          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -sSfL -o "$RUNNER_TEMP/$zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/$zip"
          echo "${GODOT_SHA512}  $RUNNER_TEMP/$zip" | sha512sum --check
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Run the headless runner
        run: |
          "$GODOT" --headless --path game --import
          "$GODOT" --headless --path game -s res://tools/headless_runner.gd -- \
            --seed 42 --seasons 3 --out ../telemetry/run_42.jsonl
          "$GODOT" --headless --path game -s res://tools/headless_runner.gd -- --seed 42 --plan demo --out ../telemetry/demo_42.jsonl
          "$GODOT" --headless --path game -s res://tools/headless_runner.gd -- --seed 42 --plan chokepoints --out ../telemetry/chokepoints_42.jsonl

      - name: Check the runs with Python
        run: |
          uv run --directory analysis --locked python -m tallow_analysis.check_run ../telemetry/run_42.jsonl
          uv run --directory analysis --locked python -m tallow_analysis.check_run ../telemetry/demo_42.jsonl
          uv run --directory analysis --locked python -m tallow_analysis.check_run ../telemetry/chokepoints_42.jsonl
