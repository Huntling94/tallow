name: web

# Builds the web version on every pull request (download it from the run's
# artifacts) and deploys it to GitHub Pages on every merge to main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  # Never cancel a Pages deploy partway through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Godot
        run: |
          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -sSfL -o "$RUNNER_TEMP/$zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/$zip"
          echo "${GODOT_SHA512}  $RUNNER_TEMP/$zip" | sha512sum --check
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      # The full template archive is about 1.3 GB; only the extracted web
      # templates (a few tens of MB) are cached.
      - name: Cache web templates
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-web-templates-${{ env.GODOT_VERSION }}-${{ hashFiles('tools/godot/install_web_templates.py') }}

      - name: Install web templates
        run: python tools/godot/install_web_templates.py

      - name: Export
        run: |
          mkdir -p build/web
          "$GODOT" --headless --path game --import
          "$GODOT" --headless --path game --export-release Web ../build/web/index.html
          test -s build/web/index.html && test -s build/web/index.pck && test -s build/web/index.wasm

      - name: Upload the build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web
          retention-days: 7

      - name: Upload for Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
