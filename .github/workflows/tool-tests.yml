name: tool-tests

# Unit tests for the repository's own checks in tools/checks/.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tool-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tools/checks -v
