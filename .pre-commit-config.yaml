# Run `pre-commit install` once after cloning to enable these hooks.
default_install_hook_types: [pre-commit, commit-msg]
# Hooks without their own stages run on commit only, not on commit messages.
default_stages: [pre-commit, pre-push, manual]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: \.(tscn|tres|import)$
      - id: end-of-file-fixer
        exclude: \.(tscn|tres|import)$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: 4.5.0
    hooks:
      - id: gdformat
      - id: gdlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        files: ^analysis/
      - id: ruff-format
        files: ^analysis/

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        files: ^analysis/notebooks/

  - repo: local
    hooks:
      - id: public-language-guard
        name: public language guard (files)
        entry: python tools/checks/public_language_guard.py files
        language: python
        types: [text]
        stages: [pre-commit, pre-push, manual]
      - id: tool-tests
        name: tests for tools/checks
        entry: python -m unittest discover -s tools/checks
        language: python
        files: ^tools/checks/
        pass_filenames: false
      - id: analysis-tests
        name: tests for analysis (needs uv)
        entry: uv run --directory analysis --locked pytest -q
        language: system
        files: ^analysis/
        pass_filenames: false
      - id: public-language-guard-message
        name: public language guard (commit message)
        entry: python tools/checks/public_language_guard.py message
        language: python
        stages: [commit-msg]
